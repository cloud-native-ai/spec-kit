# Exclusion records — reason `no-machine-fact` (requirements.md FR-002 / FR-005; data-model.md E-2).
#
# One row per **unit** whose last in-scope fact left the roster
# (contracts/migration-batches.contract.md § Facts outside the roster). The rows are the unit-level
# records; the fact-level record for the same removal lives in that contract section and in
# the feature detail's § Latest Review — an absent migration, never a silent deletion.
#
# `carrier` is the deterministic engine the unit's text actually calls (located by `grep` at write
# time), never the markdown that carried the fact. `anchor` is the resolvable in-tree location where
# the fact still lives as prose — the reason's evidence: the value is written down here and in no
# engine. The absence measurement for each row is recorded in the comment above it.
#
# Re-measured 2026-11-05 (implement, part 3) before writing this file, per the contract's
# § Verification row "the excluded facts still have no engine read point":
#   grep -rln "Bootstrap\|Operationalize\|Optimize" --include=*.py --include=*.sh scripts/ skills/   -> 0 hits
#   grep -rn "improvement-track\|changed-asset" --include=*.py --include=*.sh .                      -> 0 hits
#   grep -rn "CRITICAL\|severity" scripts/python/*.py                                                -> severity of OTHER axes only
#                                                                                                       (error/advisory, record tags), no
#                                                                                                       CRITICAL/HIGH/MEDIUM/LOW scale
#   grep -rn "clause-uncovered\|fr-uncovered" scripts/python/*.py                                    -> account-clause-coverage.py:
#                                                                                                       a NARROWER two-label set, not
#                                                                                                       this row's finding classes
# Count measured at write time: 8 rows. Re-measured 2026-11-05 (implement, part 5) with the two
# US4 rows appended for the units that never held a machine-consumed fact at all: **10 rows**. Two
# facts of the same roster contribute no row —
# `review-segment-sequence` and `history-categories` — because their unit groups keep an in-scope
# fact (`arc-verdict-mapping`, `history-manifest-schema`); a row for them would be the both-declared-
# and-excluded state data-model.md E-2 R-4 forbids.
# Re-measured 2026-11-05 (implement, part 6) with the T032 append of the screen's remaining
# candidates: **38 rows**. The 8 and 10 above stay as the readings they were, not as the current one.

