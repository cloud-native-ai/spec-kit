# candidates whose D1 holds and whose D2 does not, 28 rows. The 10 rows above are untouched (E-2: a
# new unit appends, never reorders), and a unit already covered by a declaration never appears here
# (E-2 R-4, E-5).
# D1 holds for these 28 because the deliverable named in each row's comment IS one of the four kinds
# the consumer list points at. The kind is marked per row: (a) evidence record, (b) feedback or
# learning record, (c) gate verdict on someone else's artifact, (d) a change to a governed tree
# (FR-002 D1).
# D2 fails, and the measurement is the run rather than this comment: on the tree these rows were
# written against, `harness-triple-check.py --action coverage` reports `declarations: 23` and names
# none of these units in any declaration's `consumers` or `former_carriers`. The values these units
# carry are workflow obligations and judgement prose — what a stage must do, in what order, and why
# — and the engine in the `carrier` column reads no value out of that text to reach a verdict.
# FR-006 leaves that in markdown: the carriers stay as they are and no literal is deleted.
# `carrier` is the engine the unit's text actually reaches, located by `grep` at write time: a
# `scripts/python/<name>.py` reference where the unit names one, and the unit's own
# `${SKILL_HOME}/scripts/<file>` asset where its engine is invoked by relative path.
# Count after this append: 38 rows (10 + 28).

