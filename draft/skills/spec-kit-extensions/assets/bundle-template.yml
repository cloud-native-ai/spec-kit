# Bundle manifest template
# Copy to  bundle.yml  and customize. Adapted from upstream
# main:examples/bundles/developer/bundle.yml.
#
# A bundle is a role-based AGGREGATE: it installs nothing new itself, it
# references extensions + presets + workflows + steps and resolves/installs
# them together as a ready-to-use setup for a role.

schema_version: "1.0"

bundle:
  # CUSTOMIZE: lowercase bundle id.
  id: "my-role"

  # CUSTOMIZE: human-readable name.
  name: "My Role"

  # CUSTOMIZE: semantic version.
  version: "1.0.0"

  # CUSTOMIZE: the role this bundle targets (e.g. developer, product-manager).
  role: "my-role"

  # CUSTOMIZE: what this bundle sets up.
  description: "Spec-Driven Development setup for <role>: what it enables."

  # CUSTOMIZE: author.
  author: "Your Name"

  # REVIEW: license.
  license: "MIT"

requires:
  # CUSTOMIZE: minimum Spec Kit version.
  speckit_version: ">=0.9.0"
  # OPTIONAL: external tools / MCP servers required by the bundled members.
  tools: []
  mcp: []

# Members the bundle pulls in. Keep version pins aligned with catalog entries.
provides:
  # Extensions to install (add commands / hooks).
  extensions:
    - id: "agent-context"
      version: "1.0.0"

  # Presets to install (template / command overrides). Each carries a priority
  # (lower = higher precedence) and an optional compose strategy.
  presets:
    - id: "implementation-planning"
      version: "1.0.0"
      priority: 10
      strategy: "append"

  # Named steps this bundle contributes.
  steps:
    - id: "plan-implementation"
    - id: "break-down-tasks"

  # Workflows to install (resumable pipelines).
  workflows:
    - id: "spec-to-implementation"
      version: "1.0.0"

# CUSTOMIZE: tags for catalog discovery.
tags: ["development", "implementation", "code-review"]
