[project]
name = "specify-cli"
version = "0.0.22"
description = "Specify CLI, part of GitHub Spec Kit. A tool to bootstrap your projects for Spec-Driven Development (SDD)."
requires-python = ">=3.8"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "platformdirs",
    "readchar",
    "truststore>=0.10.4; python_version >= '3.10'",
]

# Dev/test-only tooling. This group is never installed with the CLI itself: the runtime
# dependency set above stays the shipping boundary, and `[tool.hatch.build]` is untouched.
# pytest-xdist carries the >= 3.9 marker because its 3.x line refuses to run on 3.8 —
# the canonical runner then reports `reason=no-xdist` and runs serially (086 C-006).
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist; python_version >= '3.9'",
]

[project.scripts]
specify = "specify_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 043: embed the framework source commit at build time (see hatch_build.py)
[tool.hatch.build.hooks.custom]
path = "src/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/specify_cli"]

[tool.hatch.build.targets.wheel.sources]
"src" = "specify_cli"

[tool.hatch.build.targets.wheel.force-include]
"memory" = "specify_cli/memory"
"scripts" = "specify_cli/scripts"
"templates" = "specify_cli/templates"
"agents" = "specify_cli/agents"
"shared" = "specify_cli/shared"
# "skills" is intentionally absent here: src/hatch_build.py stage-copies it
# minus every `site` runtime-data component (spec 046 / contracts/framework-exclusions.md).

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: contract and external-surface validation tests",
    "integration: integration tests using filesystem or fixture workspaces",
    "serial: not parallel-safe — excluded from the runner's parallel pass and re-run by its serial pass",
]
