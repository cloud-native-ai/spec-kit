[project]
name = "specify-cli"
version = "0.0.22"
description = "Specify CLI, an independent fork of GitHub Spec Kit (not affiliated with or endorsed by GitHub). A tool to bootstrap your projects for Spec-Driven Development (SDD)."
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.8"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "readchar",
    "truststore>=0.10.4; python_version >= '3.10'",
]

# Dev/test-only tooling. This group is never installed with the CLI itself: the runtime
# dependency set above stays the shipping boundary, and `[tool.hatch.build]` is untouched.
# pytest-xdist carries the >= 3.9 marker because its 3.x line refuses to run on 3.8 —
# the canonical runner then reports `reason=no-xdist` and runs serially (086 C-006).
# ruff is the local lint gate's engine (`[tool.ruff]` below); it is a build-time check,
# never an import of the shipped code, so it stays in this group.
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist; python_version >= '3.9'",
    "ruff",
]

[project.scripts]
specify = "specify_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 043: embed the framework source commit at build time (see hatch_build.py)
[tool.hatch.build.hooks.custom]
path = "src/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/specify_cli"]

[tool.hatch.build.targets.wheel.sources]
"src" = "specify_cli"

[tool.hatch.build.targets.wheel.force-include]
"seed" = "specify_cli/seed"
"scripts" = "specify_cli/scripts"
"templates" = "specify_cli/templates"
"agents" = "specify_cli/agents"
"shared" = "specify_cli/shared"
# "skills" is intentionally absent here: src/hatch_build.py stage-copies it
# minus every `site` runtime-data component (spec 046 / contracts/framework-exclusions.md).

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: contract and external-surface validation tests",
    "integration: integration tests using filesystem or fixture workspaces",
    "serial: not parallel-safe — excluded from the runner's parallel pass and re-run by its serial pass",
    "slow: process-boundary (spawns/waits for/terminates an external process or queue) or corpus-scan (traverses the real framework corpus) tests — the runner's default fast tier excludes them; --full runs them",
]

# Local lint gate (security rules only). Adapted-from: 24d76b5d9 (pytest + ruff in CI)
# and 8e76ff3d5 (the S602/S604/S605 lock on `shell=True`). Upstream's gate is a GitHub
# Actions workflow running `ruff check src/`; this fork tracks no `.github/workflows`
# (intranet remotes), so the gate is a local command over the shipped Python surface:
#
#     ruff check src scripts skills
#
# The suite is deliberately not a lint subject: regression cases seed `shell=True` calls
# as negative samples to prove a guard rejects them, and those seeds are data, not defects.
# `select` rather than upstream's `extend-select` is deliberate: it pins the enabled
# set instead of inheriting ruff's defaults, which carry a large existing debt on this
# tree. The three rules below measure zero findings here, so the gate needs no
# exemption list; widening it is a triage decision on that recorded debt, not a
# blanket `# noqa`. Any deliberate deviation is acknowledged with a rule-named noqa.
[tool.ruff]
target-version = "py38"  # mirrors project.requires-python
# .specify/ is the client-runtime projection: generated mirrors of the sources linted
# above, plus frozen spec/archive/history records that are never rewritten.
extend-exclude = [".specify"]

[tool.ruff.lint]
select = [
    "S602",  # subprocess-popen-with-shell-equals-true
    "S604",  # call-with-shell-equals-true
    "S605",  # start-process-with-a-shell
]
