description = "Create Agent Skills
handoffs:
  - label: Update Instructions
    agent: speckit.instructions
    prompt: Update project instructions so the new skill is discoverable.
    send: true
scripts:
  sh: scripts/bash/create-new-skill.sh --json $ARGUMENTS
---

> `/speckit.skills` is the orchestration entrypoint for Skill management. It delegates to `create-skills` (new) or `improve-skills` (existing, with mandatory spec-compliance modernization pass first).

## User Input

```text
$ARGUMENTS
```

Process `$ARGUMENTS` per the [User Input Protocol](skills/sdd-workflow/references/user-input-protocol.md). Extract target Skill name (concise command-like identifier: letters, digits, hyphens, underscores).

## Orchestration Workflow

### Step 1: Parse target Skill

- If user names a Skill explicitly → use that name
- If empty → infer from conversation or ask one targeted question

### Step 2: Check existence

Check `.specify/skills/<name>/SKILL.md` exists (canonical source).

### Step 3: Route

**If NOT exists** → delegate to `create-skills` skill:
- Read `skills/create-skills/SKILL.md` for full workflow
- New Skill MUST conform to current spec (directory layout, frontmatter, `${SKILL_HOME}`/`${SKILL_WORKDIR}` conventions)
- Use `templates/skills-template.md` as starting point

**If EXISTS** → delegate to `improve-skills` skill with two-phase pass:
1. **Phase A — Spec-compliance modernization** (mandatory before any optimization):
   - Canonical path: `.specify/skills/<name>/SKILL.md`
   - Directory structure: `SKILL.md`, `scripts/`, `references/`, `assets/`
   - Frontmatter: `name`, `description` (with triggers), `skill_id`
   - Path conventions: `${SKILL_HOME}/` for Skill-owned resources, `${SKILL_WORKDIR}/` for runtime paths
   - Legacy idiom migration: `./X` → `${SKILL_HOME}/X`, `${SKILL_ROOT}/X` → `${SKILL_HOME}/X`
   - Registry: one deduplicated row in `.specify/instructions.md` `### Skills`
   - Hygiene: SKILL.md under 500 lines; oversize → `references/`

2. **Phase B — User-requested refinement**: Standard `improve-skills` workflow.

For detailed path conventions (`${SKILL_HOME}` / `${SKILL_WORKDIR}` semantics, computation idioms, nested invocations), see `skills/create-skills/SKILL.md`.

### Step 4: Propagate to built-in agents (create path only)

After a **new** Skill is created (skip on the `improve-skills` path), wire it into the built-in role agents so they prefer it for role-relevant work (Feature 026 Skill Enablement convention; see `docs/agents/command-and-skills.md`).

1. **Guard**: skip if the new Skill is non-declarable (reference-only/meta: `sdd-workflow`, `create-agent`, `improve-agent`, `create-skills`, `improve-skills`, `create-team`, `improve-team`). Normal user-created Skills proceed.
2. **Analyze**: read the 7 built-in role agents from `.specify/agents/` (`requirements-analyst`, `system-designer`, `module-designer`, `test-engineer`, `qa-engineer`, `knowledge-manager`, `ux-analyst`). Judge each agent"

prompt = """
> `/speckit.skills` is the orchestration entrypoint for Skill management. It delegates to `create-skills` (new) or `improve-skills` (existing, with mandatory spec-compliance modernization pass first).

## User Input

```text
$ARGUMENTS
```

Process `$ARGUMENTS` per the [User Input Protocol](skills/sdd-workflow/references/user-input-protocol.md). Extract target Skill name (concise command-like identifier: letters, digits, hyphens, underscores).

## Orchestration Workflow

### Step 1: Parse target Skill

- If user names a Skill explicitly → use that name
- If empty → infer from conversation or ask one targeted question

### Step 2: Check existence

Check `.specify/skills/<name>/SKILL.md` exists (canonical source).

### Step 3: Route

**If NOT exists** → delegate to `create-skills` skill:
- Read `skills/create-skills/SKILL.md` for full workflow
- New Skill MUST conform to current spec (directory layout, frontmatter, `${SKILL_HOME}`/`${SKILL_WORKDIR}` conventions)
- Use `.specify/templates/skills-template.md` as starting point

**If EXISTS** → delegate to `improve-skills` skill with two-phase pass:
1. **Phase A — Spec-compliance modernization** (mandatory before any optimization):
   - Canonical path: `.specify/skills/<name>/SKILL.md`
   - Directory structure: `SKILL.md`, `.specify/scripts/`, `references/`, `assets/`
   - Frontmatter: `name`, `description` (with triggers), `skill_id`
   - Path conventions: `${SKILL_HOME}/` for Skill-owned resources, `${SKILL_WORKDIR}/` for runtime paths
   - Legacy idiom migration: `./X` → `${SKILL_HOME}/X`, `${SKILL_ROOT}/X` → `${SKILL_HOME}/X`
   - Registry: one deduplicated row in `.specify/instructions.md` `### Skills`
   - Hygiene: SKILL.md under 500 lines; oversize → `references/`

2. **Phase B — User-requested refinement**: Standard `improve-skills` workflow.

For detailed path conventions (`${SKILL_HOME}` / `${SKILL_WORKDIR}` semantics, computation idioms, nested invocations), see `skills/create-skills/SKILL.md`.

### Step 4: Propagate to built-in agents (create path only)

After a **new** Skill is created (skip on the `improve-skills` path), wire it into the built-in role agents so they prefer it for role-relevant work (Feature 026 Skill Enablement convention; see `docs/agents/command-and-skills.md`).

1. **Guard**: skip if the new Skill is non-declarable (reference-only/meta: `sdd-workflow`, `create-agent`, `improve-agent`, `create-skills`, `improve-skills`, `create-team`, `improve-team`). Normal user-created Skills proceed.
2. **Analyze**: read the 7 built-in role agents from `.specify/agents/` (`requirements-analyst`, `system-designer`, `module-designer`, `test-engineer`, `qa-engineer`, `knowledge-manager`, `ux-analyst`). Judge each agent's role (Identity & Responsibilities) against the new Skill's capability + trigger keywords.
3. **Match**: select the agents whose role operations the Skill covers and draft a one-line "when to use" per match. If none match, report "no role-relevant agents" and skip edits (no forced use).
4. **Propose**: present a `| Agent | Skill | When to use |` table and wait for user confirmation before editing.
5. **Apply** (on confirm): for each matched agent, edit BOTH `agents/<slug>.agent.md` and `.specify/agents/<slug>.agent.md`:
   - Append the canonical Skill slug to the `skills:` frontmatter list (dedup; preserve order and all other keys).
   - Add a `| <skill> | <when-to-use> |` row to that agent's `## Skill Enablement` table.
6. **Invariants**: use the canonical slug; it MUST resolve to an installed `.specify/skills/<slug>/SKILL.md`; never add a non-declarable slug; preserve all existing frontmatter. Generator templates (`agent-role-*-template.md`) are intentionally NOT updated (a later regeneration would drop the added Skill).

### Step 5: Validate and report

- Confirm frontmatter valid (`name`, `description`, `skill_id`)
- Verify canonical path matches `.specify/skills/<name>/SKILL.md`
- Verify Skills registry includes deduplicated row
- Report: paths, skill_id, registry edits, modernization results, and (create path) which built-in agents the Skill was propagated to

For agent-specific operational guidance, see `skills/sdd-workflow/references/agent-configuration.md`.

## Handoffs

**After**: Run `/speckit.instructions` to update discovery metadata.
"""
